name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: investigator_test
          POSTGRES_USER: investigator_test
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U investigator_test" --health-interval 5s --health-retries 15
    env:
      TEST_JDBC_URL: jdbc:postgresql://localhost:5432/investigator_test
      TEST_DB_USER: investigator_test
      TEST_DB_PASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s src/test/python
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix mcp-runtime && npm audit --omit=dev --prefix mcp-runtime
      - run: docker build -t incident-investigator:ci .
