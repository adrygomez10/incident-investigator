[tool.ruff]
required-version = "==0.15.16"
target-version = "py312"
line-length = 79
indent-width = 4
extend-exclude = [".tools", "target", "reports", "mcp-runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
