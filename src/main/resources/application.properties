spring.application.name=incident-investigator
server.port=${PORT:8080}
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=64KB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/investigator}
spring.datasource.username=${DB_USER:investigator}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.io.modelcontextprotocol=OFF
